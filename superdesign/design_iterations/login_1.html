<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ledgr — Login</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          navy: '#0F1729', navy2: '#182242', gold: '#D4A853', goldLight: '#E8C878',
          offwhite: '#FAFAF8', accent: '#3B82F6', income: '#10B981', expense: '#EF4444',
        },
        fontFamily: { sans: ['Inter', 'sans-serif'] },
        boxShadow: {
          card: '0 1px 2px rgba(15,23,41,0.04), 0 10px 24px -10px rgba(15,23,41,0.18)',
          phone: '0 30px 70px -15px rgba(15,23,41,0.5)',
        },
      },
    },
  };
</script>
<style>
  body { font-family: 'Inter', sans-serif; }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
</style>
</head>
<body class="bg-neutral-200 min-h-screen flex items-center justify-center p-6">

  <div class="w-[390px] h-[844px] rounded-[44px] overflow-hidden shadow-phone relative ring-1 ring-black/5" style="background: radial-gradient(120% 60% at 50% 0%, #182242 0%, #0F1729 55%, #0B1120 100%);">

    <!-- Dynamic Island -->
    <div class="absolute top-2.5 left-1/2 -translate-x-1/2 w-[126px] h-[34px] bg-black rounded-full z-50"></div>

    <!-- Status bar -->
    <div class="flex items-center justify-between text-white text-[15px] font-semibold px-7 pt-14 -mt-2 mb-2">
      <span>9:41</span>
      <div class="flex items-center gap-1.5">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="7" width="3" height="5" rx="0.6"/><rect x="5" y="5" width="3" height="7" rx="0.6"/><rect x="10" y="3" width="3" height="9" rx="0.6"/><rect x="15" y="0" width="3" height="12" rx="0.6"/></svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><path d="M8 9.6a1.3 1.3 0 100 2.6 1.3 1.3 0 000-2.6zM4.7 7a4.9 4.9 0 016.6 0L10 8.4a2.9 2.9 0 00-4 0L4.7 7zM2.1 4.4a8.4 8.4 0 0111.8 0L12.6 5.8a6.4 6.4 0 00-9.2 0L2.1 4.4z"/></svg>
        <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="2.5" stroke="white"/><rect x="2" y="2" width="18" height="8" rx="1.5" fill="white"/><rect x="22.5" y="4" width="1.5" height="4" rx="0.75" fill="white"/></svg>
      </div>
    </div>

    <!-- Brand block -->
    <div class="flex flex-col items-center pt-8 pb-7">
      <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-gold to-goldLight flex items-center justify-center shadow-lg mb-4">
        <span class="text-navy text-[30px] font-extrabold">L</span>
      </div>
      <p class="text-white text-[24px] font-extrabold tracking-tight">Ledgr</p>
      <p class="text-neutral-400 text-[13px] font-medium mt-1.5">Your money, in 5 minutes a day.</p>
    </div>

    <!-- Form card -->
    <div class="bg-white rounded-t-[32px] absolute bottom-0 left-0 right-0 px-6 pt-8 pb-10" style="height: 560px;">
      <p class="text-navy text-[22px] font-bold">Welcome back</p>
      <p class="text-neutral-500 text-[13px] mt-1.5 mb-7">Sign in to continue tracking your finances</p>

      <p class="text-[11px] font-bold text-neutral-400 tracking-wider mb-2">EMAIL ADDRESS</p>
      <div class="border border-neutral-200 rounded-2xl px-4 py-3.5 mb-5 flex items-center gap-2.5">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 7l10 6 10-6"/></svg>
        <p class="text-navy text-[14px] font-medium">gowtham@example.com</p>
      </div>

      <p class="text-[11px] font-bold text-neutral-400 tracking-wider mb-2">PASSWORD</p>
      <div class="border border-neutral-200 rounded-2xl px-4 py-3.5 mb-2 flex items-center gap-2.5">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="2"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
        <p class="text-navy text-[18px] font-medium tracking-widest flex-1">••••••••</p>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      </div>

      <div class="flex justify-end mb-7">
        <span class="text-accent text-[13px] font-semibold">Forgot password?</span>
      </div>

      <button class="w-full text-navy text-[15px] font-bold py-4 rounded-2xl shadow-lg mb-6" style="background: linear-gradient(90deg, #D4A853, #E8C878);">
        Sign In
      </button>

      <div class="flex items-center justify-center gap-1.5">
        <span class="text-neutral-500 text-[13px]">Don't have an account?</span>
        <span class="text-navy text-[13px] font-bold">Create one →</span>
      </div>
    </div>

  </div>

</body>
</html>
