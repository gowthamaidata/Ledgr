<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ledgr — Transactions</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          navy: '#0F1729', navy2: '#182242', gold: '#D4A853', goldLight: '#E8C878',
          offwhite: '#FAFAF8', accent: '#3B82F6', income: '#10B981', expense: '#EF4444',
        },
        fontFamily: { sans: ['Inter', 'sans-serif'] },
        boxShadow: {
          card: '0 1px 2px rgba(15,23,41,0.04), 0 10px 24px -10px rgba(15,23,41,0.18)',
          phone: '0 30px 70px -15px rgba(15,23,41,0.5)',
        },
      },
    },
  };
</script>
<style>
  body { font-family: 'Inter', sans-serif; }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
</style>
</head>
<body class="bg-neutral-200 min-h-screen flex items-center justify-center p-6">

  <div class="w-[390px] h-[844px] bg-offwhite rounded-[44px] overflow-hidden shadow-phone relative flex flex-col ring-1 ring-black/5">

    <!-- Dynamic Island -->
    <div class="absolute top-2.5 left-1/2 -translate-x-1/2 w-[126px] h-[34px] bg-black rounded-full z-50"></div>

    <!-- Status bar -->
    <div class="flex items-center justify-between text-navy text-[15px] font-semibold px-7 pt-14 -mt-2 mb-1">
      <span>9:41</span>
      <div class="flex items-center gap-1.5">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="7" width="3" height="5" rx="0.6"/><rect x="5" y="5" width="3" height="7" rx="0.6"/><rect x="10" y="3" width="3" height="9" rx="0.6"/><rect x="15" y="0" width="3" height="12" rx="0.6"/></svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><path d="M8 9.6a1.3 1.3 0 100 2.6 1.3 1.3 0 000-2.6zM4.7 7a4.9 4.9 0 016.6 0L10 8.4a2.9 2.9 0 00-4 0L4.7 7zM2.1 4.4a8.4 8.4 0 0111.8 0L12.6 5.8a6.4 6.4 0 00-9.2 0L2.1 4.4z"/></svg>
        <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="2.5" stroke="#0F1729"/><rect x="2" y="2" width="18" height="8" rx="1.5" fill="#0F1729"/><rect x="22.5" y="4" width="1.5" height="4" rx="0.75" fill="#0F1729"/></svg>
      </div>
    </div>

    <!-- Header -->
    <div class="flex items-center justify-between px-6 pt-3 pb-4">
      <p class="text-navy text-[24px] font-extrabold">Transactions</p>
      <button class="flex items-center gap-1.5 bg-navy text-white text-[12.5px] font-semibold px-3.5 py-2 rounded-xl">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
        Filter
      </button>
    </div>

    <!-- Search bar -->
    <div class="px-6 mb-3">
      <div class="flex items-center gap-2.5 bg-white border border-neutral-200 rounded-2xl px-4 py-3 shadow-card">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <p class="text-neutral-400 text-[14px]">Search transactions...</p>
      </div>
    </div>

    <!-- Filter pills -->
    <div class="px-6 mb-4">
      <div class="flex items-center gap-2 overflow-x-auto no-scrollbar">
        <span class="shrink-0 px-4 py-2 rounded-full bg-navy text-white text-[12.5px] font-semibold">All</span>
        <span class="shrink-0 px-4 py-2 rounded-full bg-white border border-neutral-200 text-neutral-500 text-[12.5px] font-semibold">Expense</span>
        <span class="shrink-0 px-4 py-2 rounded-full bg-white border border-neutral-200 text-neutral-500 text-[12.5px] font-semibold">Income</span>
        <span class="shrink-0 px-4 py-2 rounded-full bg-white border border-neutral-200 text-neutral-500 text-[12.5px] font-semibold">This Month</span>
      </div>
    </div>

    <!-- List -->
    <div class="flex-1 overflow-y-auto no-scrollbar px-6 pb-28">

      <p class="text-[11.5px] font-bold text-neutral-400 tracking-wider mb-2 mt-1">TODAY · AUG 24</p>
      <div class="bg-white rounded-2xl shadow-card divide-y divide-neutral-100 mb-5">
        <div class="flex items-center gap-3 p-4">
          <div class="w-11 h-11 rounded-full bg-amber-50 flex items-center justify-center text-[20px] shrink-0">🍔</div>
          <div class="flex-1 min-w-0">
            <p class="text-[14px] font-semibold text-navy truncate">Swiggy</p>
            <div class="flex items-center gap-2 mt-1">
              <span class="text-[12px] text-neutral-400">Food &amp; Dining</span>
              <span class="text-[10px] font-bold text-accent bg-blue-50 px-1.5 py-0.5 rounded-md">UPI</span>
            </div>
          </div>
          <p class="text-[14px] font-bold text-expense shrink-0">-₹485</p>
        </div>
      </div>

      <p class="text-[11.5px] font-bold text-neutral-400 tracking-wider mb-2">YESTERDAY · AUG 23</p>
      <div class="bg-white rounded-2xl shadow-card divide-y divide-neutral-100">

        <div class="flex items-center gap-3 p-4">
          <div class="w-11 h-11 rounded-full bg-red-50 flex items-center justify-center text-[20px] shrink-0">🏠</div>
          <div class="flex-1 min-w-0">
            <p class="text-[14px] font-semibold text-navy truncate">Rent Payment</p>
            <div class="flex items-center gap-2 mt-1">
              <span class="text-[12px] text-neutral-400">Rent / EMI</span>
              <span class="text-[10px] font-bold text-neutral-500 bg-neutral-100 px-1.5 py-0.5 rounded-md">Bank</span>
            </div>
          </div>
          <p class="text-[14px] font-bold text-expense shrink-0">-₹22,000</p>
        </div>

        <div class="flex items-center gap-3 p-4">
          <div class="w-11 h-11 rounded-full bg-emerald-50 flex items-center justify-center text-[20px] shrink-0">💼</div>
          <div class="flex-1 min-w-0">
            <p class="text-[14px] font-semibold text-navy truncate">Salary</p>
            <div class="flex items-center gap-2 mt-1">
              <span class="text-[12px] text-neutral-400">Income</span>
              <span class="text-[10px] font-bold text-neutral-500 bg-neutral-100 px-1.5 py-0.5 rounded-md">Bank</span>
            </div>
          </div>
          <p class="text-[14px] font-bold text-income shrink-0">+₹85,000</p>
        </div>

        <div class="flex items-center gap-3 p-4">
          <div class="w-11 h-11 rounded-full bg-blue-50 flex items-center justify-center text-[20px] shrink-0">⚡</div>
          <div class="flex-1 min-w-0">
            <p class="text-[14px] font-semibold text-navy truncate">BESCOM</p>
            <div class="flex items-center gap-2 mt-1">
              <span class="text-[12px] text-neutral-400">Utilities</span>
              <span class="text-[10px] font-bold text-accent bg-blue-50 px-1.5 py-0.5 rounded-md">UPI</span>
            </div>
          </div>
          <p class="text-[14px] font-bold text-expense shrink-0">-₹1,240</p>
        </div>

        <div class="flex items-center gap-3 p-4">
          <div class="w-11 h-11 rounded-full bg-green-50 flex items-center justify-center text-[20px] shrink-0">🛒</div>
          <div class="flex-1 min-w-0">
            <p class="text-[14px] font-semibold text-navy truncate">DMart</p>
            <div class="flex items-center gap-2 mt-1">
              <span class="text-[12px] text-neutral-400">Groceries</span>
              <span class="text-[10px] font-bold text-neutral-500 bg-neutral-100 px-1.5 py-0.5 rounded-md">Cash</span>
            </div>
          </div>
          <p class="text-[14px] font-bold text-expense shrink-0">-₹2,180</p>
        </div>

      </div>
    </div>

    <!-- Bottom Nav -->
    <div class="absolute bottom-0 left-0 right-0 bg-white/95 backdrop-blur border-t border-neutral-100 px-6 pt-2.5 pb-8 z-40">
      <div class="flex items-center justify-between">
        <button class="flex flex-col items-center gap-1 text-neutral-400 w-12">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5l9-7 9 7V20a1 1 0 01-1 1h-5v-8H9v8H4a1 1 0 01-1-1V9.5z"/></svg>
          <span class="text-[10.5px] font-medium">Home</span>
        </button>
        <button class="flex flex-col items-center gap-1 text-neutral-400 w-12">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18M18 17V9M13 17V5M8 17v-4"/></svg>
          <span class="text-[10.5px] font-medium">Insights</span>
        </button>
        <button class="w-14 h-14 rounded-full bg-navy flex items-center justify-center shadow-lg -mt-9 ring-[6px] ring-offwhite shrink-0">
          <span class="text-gold text-[26px] font-light leading-none -mt-0.5">+</span>
        </button>
        <button class="flex flex-col items-center gap-1 text-navy w-12">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 012-2h12a2 2 0 012 2v1H3V7z"/><path d="M3 8h18v9a2 2 0 01-2 2H5a2 2 0 01-2-2V8z"/><path d="M16 13h2"/></svg>
          <span class="text-[10.5px] font-semibold">Accounts</span>
        </button>
        <button class="flex flex-col items-center gap-1 text-neutral-400 w-12">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
          <span class="text-[10.5px] font-medium">Settings</span>
        </button>
      </div>
    </div>

  </div>

</body>
</html>
