<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ledgr — Quick Add</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          navy: '#0F1729', navy2: '#182242', gold: '#D4A853', goldLight: '#E8C878',
          offwhite: '#FAFAF8', accent: '#3B82F6', income: '#10B981', expense: '#EF4444',
        },
        fontFamily: { sans: ['Inter', 'sans-serif'] },
        boxShadow: {
          card: '0 1px 2px rgba(15,23,41,0.04), 0 10px 24px -10px rgba(15,23,41,0.18)',
          phone: '0 30px 70px -15px rgba(15,23,41,0.5)',
          sheet: '0 -12px 40px -8px rgba(15,23,41,0.35)',
        },
      },
    },
  };
</script>
<style>
  body { font-family: 'Inter', sans-serif; }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
</style>
</head>
<body class="bg-neutral-200 min-h-screen flex items-center justify-center p-6">

  <div class="w-[390px] h-[844px] bg-offwhite rounded-[44px] overflow-hidden shadow-phone relative ring-1 ring-black/5">

    <!-- Dynamic Island -->
    <div class="absolute top-2.5 left-1/2 -translate-x-1/2 w-[126px] h-[34px] bg-black rounded-full z-[60]"></div>

    <!-- Dimmed dashboard background -->
    <div class="absolute inset-0">
      <div class="bg-navy pt-14 pb-8 px-6 h-[300px]">
        <div class="flex items-center justify-between text-white text-[15px] font-semibold mb-6 -mt-2">
          <span>9:41</span>
          <div class="flex items-center gap-1.5">
            <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="7" width="3" height="5" rx="0.6"/><rect x="5" y="5" width="3" height="7" rx="0.6"/><rect x="10" y="3" width="3" height="9" rx="0.6"/><rect x="15" y="0" width="3" height="12" rx="0.6"/></svg>
            <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><path d="M8 9.6a1.3 1.3 0 100 2.6 1.3 1.3 0 000-2.6zM4.7 7a4.9 4.9 0 016.6 0L10 8.4a2.9 2.9 0 00-4 0L4.7 7zM2.1 4.4a8.4 8.4 0 0111.8 0L12.6 5.8a6.4 6.4 0 00-9.2 0L2.1 4.4z"/></svg>
            <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="2.5" stroke="white"/><rect x="2" y="2" width="18" height="8" rx="1.5" fill="white"/><rect x="22.5" y="4" width="1.5" height="4" rx="0.75" fill="white"/></svg>
          </div>
        </div>
        <div class="flex items-center justify-between mb-6">
          <div>
            <p class="text-neutral-300 text-[13px] font-medium">Good morning 👋</p>
            <p class="text-white text-[20px] font-bold mt-0.5">Gowtham</p>
          </div>
          <div class="w-11 h-11 rounded-full bg-gradient-to-br from-gold to-goldLight flex items-center justify-center text-navy font-bold text-[16px]">G</div>
        </div>
        <div class="rounded-2xl p-5 h-[150px]" style="background: linear-gradient(135deg, #182242 0%, #0F1729 60%, #0B1120 100%);">
          <p class="text-gold text-[12px] font-bold tracking-[0.12em]">AUGUST 2026</p>
          <p class="text-white text-[34px] font-extrabold mt-3">₹38,450</p>
        </div>
      </div>
      <div class="bg-offwhite flex-1 h-full"></div>
    </div>

    <!-- Dark overlay -->
    <div class="absolute inset-0 bg-navy/60 z-10"></div>

    <!-- Bottom sheet -->
    <div class="absolute bottom-0 left-0 right-0 h-[660px] bg-white rounded-t-[28px] shadow-sheet z-20 flex flex-col">

      <!-- Drag handle -->
      <div class="flex justify-center pt-3 pb-1">
        <div class="w-10 h-1.5 bg-neutral-200 rounded-full"></div>
      </div>

      <!-- Header -->
      <div class="flex items-center justify-between px-6 pt-2 pb-4">
        <p class="text-navy text-[19px] font-bold">Add Transaction</p>
        <button class="w-8 h-8 rounded-full bg-neutral-100 flex items-center justify-center">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#0F1729" stroke-width="2.4" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>

      <div class="flex-1 overflow-y-auto no-scrollbar px-6 pb-6">

        <!-- Type toggle -->
        <div class="flex items-center bg-neutral-100 rounded-xl p-1 mb-6">
          <button class="flex-1 py-2.5 rounded-lg bg-navy text-white text-[13px] font-semibold">Expense</button>
          <button class="flex-1 py-2.5 rounded-lg text-neutral-500 text-[13px] font-semibold">Income</button>
          <button class="flex-1 py-2.5 rounded-lg text-neutral-500 text-[13px] font-semibold">Transfer</button>
        </div>

        <!-- Amount input -->
        <p class="text-[12px] font-bold text-neutral-400 tracking-wide mb-2">AMOUNT</p>
        <div class="border-2 border-accent rounded-2xl px-5 py-5 flex items-center justify-center bg-blue-50/30 mb-6">
          <span class="text-navy text-[32px] font-extrabold mr-1">₹</span>
          <span class="text-navy text-[38px] font-extrabold tracking-tight">485</span>
        </div>

        <!-- Category chips -->
        <p class="text-[12px] font-bold text-neutral-400 tracking-wide mb-2.5">CATEGORY</p>
        <div class="flex flex-wrap gap-2 mb-6">
          <button class="flex items-center gap-1.5 px-4 py-2.5 rounded-full border border-neutral-200 text-navy text-[13px] font-semibold bg-white">
            <span>🍔</span> Food
          </button>
          <button class="flex items-center gap-1.5 px-4 py-2.5 rounded-full border border-neutral-200 text-navy text-[13px] font-semibold bg-white">
            <span>🏠</span> Rent
          </button>
          <button class="flex items-center gap-1.5 px-4 py-2.5 rounded-full border-2 border-accent text-accent text-[13px] font-bold bg-blue-50">
            <span>🚗</span> Transport
          </button>
          <button class="flex items-center gap-1.5 px-4 py-2.5 rounded-full border border-neutral-200 text-navy text-[13px] font-semibold bg-white">
            <span>🛒</span> Groceries
          </button>
          <button class="flex items-center gap-1.5 px-4 py-2.5 rounded-full border border-neutral-200 text-navy text-[13px] font-semibold bg-white">
            <span>💡</span> Utilities
          </button>
        </div>

        <!-- Merchant field -->
        <p class="text-[12px] font-bold text-neutral-400 tracking-wide mb-2">PAID TO / RECEIVED FROM</p>
        <div class="border border-neutral-200 rounded-2xl px-4 py-3.5 mb-8">
          <p class="text-navy text-[15px] font-semibold">Swiggy</p>
        </div>

        <!-- Save button -->
        <button class="w-full bg-navy text-white text-[15px] font-bold py-4 rounded-2xl shadow-lg">
          Save Transaction
        </button>
      </div>
    </div>

  </div>

</body>
</html>
